# TingCloudVerifier 配置示例
# 复制为 config.yaml 并修改

server:
  host: "0.0.0.0"
  port: 10211

database:
  # sqlite / postgresql
  type: "sqlite"
  sqlite_path: "./tingcloud.db"
  # postgresql 配置预留给扩展
  # postgresql:
  #   host: "127.0.0.1"
  #   port: 5432
  #   dbname: "tingcloud"
  #   user: "tingcloud"

security:
  # 管理接口安全等级：LOCAL / LAN / PUBLIC
  admin_security_level: "LAN"

  # 重放保护时间窗口（秒）
  replay_window_seconds: 60

  # Session Token 有效期（秒）
  session_ttl_seconds: 1800

  # 临时 Token 默认有效期（秒）
  temp_token_ttl_seconds: 3600

  # 密码哈希
  password_hasher: "argon2id"

  # AES 服务器密钥（生产环境请通过环境变量注入）
  # server_aes_key_env: "TCV_AES_KEY"

rate_limit:
  enabled: true
  ip_per_sec: 100
  app_per_sec: 500
  license_per_sec: 10
  login_fail_lock_threshold: 5
  login_fail_lock_seconds: 300

logging:
  level: "INFO"          # TRACE / DEBUG / INFO / WARN / ERROR / FATAL
  async: true
  file_path: "./logs/tcv.log"

license:
  # 全局暂停计时
  timer_paused: false
