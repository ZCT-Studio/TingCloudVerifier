                  ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
                  ./vcpkg/vcpkg install --x-feature=postgres --x-feature=mysql --triplet=x86-windows-static --x-manifest-root="${{ github.workspace }}"
            - name: Configure
