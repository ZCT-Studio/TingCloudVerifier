            - name: Configure
              shell: pwsh
              run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=arm64-windows-static -DCMAKE_BUILD_TYPE=Release
            - name: Build
              shell: pwsh
              run: cmake --build build --config Release -j
            - name: Package
              shell: pwsh
              run: |
