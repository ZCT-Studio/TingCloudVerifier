              run: cmake -B build -S . -A Win32 -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x86-windows-static -DCMAKE_BUILD_TYPE=Release
            - name: Build
              shell: pwsh
              run: cmake --build build --config Release -j
            - name: Package
