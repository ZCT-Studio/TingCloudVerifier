    macos-x64:
        if: |
            !contains(github.event.head_commit.message, ' --nobuild') &&
            !contains(github.event.pull_request.title, ' --nobuild')
        runs-on: macos-15-intel
        steps:
            - uses: actions/checkout@v4
              with: { submodules: recursive }
            - uses: lukka/get-cmake@latest
            - name: vcpkg install
              run: |
                  git clone https://github.com/microsoft/vcpkg.git
                  ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
                  ./vcpkg/vcpkg install --x-feature=postgres --x-feature=mysql --triplet=x64-osx --x-manifest-root="${{ github.workspace }}"
            - name: Configure
              run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-osx -DCMAKE_BUILD_TYPE=Release
            - name: Build
              run: cmake --build build -j
            - name: Package
              run: |
                  mkdir -p dist
                  cp build/TingCloudVerifier dist/
                  cp -r config dist/config
                  cp -r migrations dist/migrations
                  cp -r README dist/README 2>/dev/null || true
                  cp README.md dist/README/README.zh-CN.md 2>/dev/null || true
                  cp LICENSE dist/LICENSE.TXT 2>/dev/null || true
            - uses: actions/upload-artifact@v4
              with:
                  name: TingCloudVerifier-macos-x64
                  path: dist

    release:
        if: |
            startsWith(github.ref, 'refs/tags/v') &&
            !contains(github.event.head_commit.message, ' --nobuild') &&
            !contains(github.event.pull_request.title, ' --nobuild')
        needs:
            - windows-x64
            - windows-x86
            - windows-arm64
            - linux-x64
            - linux-x86
            - linux-arm64
            - linux-arm
            - macos-arm64
            - macos-x64
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  merge-multiple: true
            - name: List Artifacts
              run: ls -lah artifacts/
            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: TingCloudVerifier ${{ github.ref_name }}
                  files: artifacts/*
                  prerelease: ${{ contains(github.ref_name, '-') }}
