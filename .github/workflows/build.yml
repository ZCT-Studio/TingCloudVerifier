name: Build and Release

on:
    push:
        branches:
            - dev
        tags: ["v*"]
    pull_request:
        branches:
            - main
            - dev
    workflow_dispatch:

permissions:
    contents: write

jobs:
    windows-x64:
        if: |
            !contains(github.event.head_commit.message, ' --nobuild') &&
            !contains(github.event.pull_request.title, ' --nobuild')
        runs-on: windows-2022
        steps:
            - uses: actions/checkout@v4
              with: { submodules: recursive }
            - uses: lukka/get-cmake@latest
            - name: vcpkg install
              shell: pwsh
              run: |
                  git clone https://github.com/microsoft/vcpkg.git
                  ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
                  ./vcpkg/vcpkg install --x-feature=postgres --x-feature=mysql --triplet=x64-windows-static --x-manifest-root="${{ github.workspace }}"
            - name: Configure
              shell: pwsh
              run: cmake -B build -S . -A x64 -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_BUILD_TYPE=Release
            - name: Build
              shell: pwsh
              run: cmake --build build --config Release -j
            - name: Package
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force dist | Out-Null
                  Copy-Item build/bin/Release/TingCloudVerifier.exe dist/
                  Copy-Item config dist/config -Recurse
                  Copy-Item migrations dist/migrations -Recurse
                  Copy-Item README dist/README -Recurse -ErrorAction SilentlyContinue
                  Copy-Item README.md dist/README/README.zh-CN.md -ErrorAction SilentlyContinue
                  Copy-Item LICENSE dist/LICENSE.TXT -ErrorAction SilentlyContinue
            - uses: actions/upload-artifact@v4
              with:
                  name: TingCloudVerifier-windows-x64
                  path: dist
    
    windows-x86:
        if: |
            !contains(github.event.head_commit.message, ' --nobuild') &&
            !contains(github.event.pull_request.title, ' --nobuild')
        runs-on: windows-2022
        steps:
            - uses: actions/checkout@v4
              with: { submodules: recursive }
            - uses: lukka/get-cmake@latest
            - name: vcpkg install
