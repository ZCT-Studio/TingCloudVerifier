    linux-x64:
        if: |
            !contains(github.event.head_commit.message, ' --nobuild') &&
            !contains(github.event.pull_request.title, ' --nobuild')
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with: { submodules: recursive }
            - uses: lukka/get-cmake@latest
            - name: vcpkg install
              run: |
                  git clone https://github.com/microsoft/vcpkg.git
                  ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
                  ./vcpkg/vcpkg install --x-feature=postgres --x-feature=mysql --triplet=x64-linux --x-manifest-root="${{ github.workspace }}"
            - name: Configure
              run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-linux -DCMAKE_BUILD_TYPE=Release
            - name: Build
              run: cmake --build build -j
            - name: Package
              run: |
                  mkdir -p dist
                  cp build/TingCloudVerifier dist/
                  cp -r config dist/config
                  cp -r migrations dist/migrations
                  cp -r README dist/README 2>/dev/null || true
                  cp README.md dist/README/README.zh-CN.md 2>/dev/null || true
                  cp LICENSE dist/LICENSE.TXT 2>/dev/null || true
            - uses: actions/upload-artifact@v4
              with:
                  name: TingCloudVerifier-linux-x64
                  path: dist
    
    linux-x86:
        if: |
            !contains(github.event.head_commit.message, ' --nobuild') &&
            !contains(github.event.pull_request.title, ' --nobuild')
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with: { submodules: recursive }
            - uses: lukka/get-cmake@latest
            - name: Install 32-bit toolchain
              run: |
                  sudo apt-get update
                  sudo apt-get install -y gcc-multilib g++-multilib
            - name: vcpkg install
              run: |
                  git clone https://github.com/microsoft/vcpkg.git
                  ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
                  ./vcpkg/vcpkg install --x-feature=postgres --x-feature=mysql --triplet=x86-linux --x-manifest-root="${{ github.workspace }}"
            - name: Configure
              run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x86-linux -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32
            - name: Build
              run: cmake --build build -j
            - name: Package
              run: |
                  mkdir -p dist
                  cp build/TingCloudVerifier dist/
                  cp -r config dist/config
                  cp -r migrations dist/migrations
                  cp -r README dist/README 2>/dev/null || true
                  cp README.md dist/README/README.zh-CN.md 2>/dev/null || true
                  cp LICENSE dist/LICENSE.TXT 2>/dev/null || true
            - uses: actions/upload-artifact@v4
              with:
                  name: TingCloudVerifier-linux-x86
                  path: dist
    
    linux-arm64:
        if: |
            !contains(github.event.head_commit.message, ' --nobuild') &&
            !contains(github.event.pull_request.title, ' --nobuild')
        runs-on: ubuntu-24.04-arm
        steps:
            - uses: actions/checkout@v4
              with: { submodules: recursive }
            - uses: lukka/get-cmake@latest
            - name: vcpkg install
              run: |
                  git clone https://github.com/microsoft/vcpkg.git
                  ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
                  ./vcpkg/vcpkg install --x-feature=postgres --x-feature=mysql --triplet=arm64-linux --x-manifest-root="${{ github.workspace }}"
            - name: Configure
              run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=arm64-linux -DCMAKE_BUILD_TYPE=Release
            - name: Build
              run: cmake --build build -j
            - name: Package
              run: |
                  mkdir -p dist
                  cp build/TingCloudVerifier dist/
                  cp -r config dist/config
                  cp -r migrations dist/migrations
                  cp -r README dist/README 2>/dev/null || true
                  cp README.md dist/README/README.zh-CN.md 2>/dev/null || true
                  cp LICENSE dist/LICENSE.TXT 2>/dev/null || true
            - uses: actions/upload-artifact@v4
              with:
                  name: TingCloudVerifier-linux-arm64
                  path: dist
    
    linux-arm:
        if: |
            !contains(github.event.head_commit.message, ' --nobuild') &&
            !contains(github.event.pull_request.title, ' --nobuild')
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with: { submodules: recursive }
            - uses: lukka/get-cmake@latest
            - name: Install cross-compiler
              run: |
                  sudo apt-get update
                  sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
            - name: vcpkg install
              run: |
                  git clone https://github.com/microsoft/vcpkg.git
                  ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
                  ./vcpkg/vcpkg install --x-feature=postgres --x-feature=mysql --triplet=arm-linux --x-manifest-root="${{ github.workspace }}"
            - name: Configure (cross + filesystem preset)
              run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=arm-linux -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=arm -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ -DCXX_FILESYSTEM_NO_LINK_NEEDED=TRUE
            - name: Build
              run: cmake --build build -j
            - name: Package
              run: |
                  mkdir -p dist
                  cp build/TingCloudVerifier dist/
                  cp -r config dist/config
                  cp -r migrations dist/migrations
                  cp -r README dist/README 2>/dev/null || true
                  cp README.md dist/README/README.zh-CN.md 2>/dev/null || true
                  cp LICENSE dist/LICENSE.TXT 2>/dev/null || true
            - uses: actions/upload-artifact@v4
              with:
                  name: TingCloudVerifier-linux-arm
                  path: dist
    
    macos-arm64:
        if: |
            !contains(github.event.head_commit.message, ' --nobuild') &&
            !contains(github.event.pull_request.title, ' --nobuild')
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
              with: { submodules: recursive }
