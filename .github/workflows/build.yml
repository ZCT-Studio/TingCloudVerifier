                  ./vcpkg/vcpkg install --x-feature=postgres --x-feature=mysql --triplet=arm64-osx --x-manifest-root="${{ github.workspace }}"
            - name: Configure
              run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=arm64-osx -DCMAKE_BUILD_TYPE=Release
            - name: Build
              run: cmake --build build -j
            - name: Package
              run: |
                  mkdir -p dist
                  cp build/TingCloudVerifier dist/
                  cp -r config dist/config
                  cp -r migrations dist/migrations
                  cp -r README dist/README 2>/dev/null || true
                  cp README.md dist/README/README.zh-CN.md 2>/dev/null || true
                  cp LICENSE dist/LICENSE.TXT 2>/dev/null || true
            - uses: actions/upload-artifact@v4
              with:
